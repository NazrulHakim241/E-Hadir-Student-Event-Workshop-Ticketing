
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>E-Hadir UiTM - Update Event</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-page">

    <!-- HEADER -->
    <header class="dashboard-header">

        <h1>E-HADIR UiTM</h1>

        <p>Committee - Update Event</p>

        <a href="manage-events.html">
            Back to Manage Events
        </a>

    </header>


    <!-- MAIN CONTENT -->
    <main class="dashboard-container">

        <h2>Update Event</h2>

        <p>
            Modify the event information below.
        </p>

        <section class="committee-section">

            <div class="event-card">

                <!-- UPDATE EVENT FORM -->
                <form id="editEventForm"
                      class="create-event-form"
                      onsubmit="updateEvent(event)">

                    <!-- EVENT NAME -->
                    <label for="eventName">
                        Event Name:
                    </label>

                    <input type="text"
                           id="eventName"
                           name="eventName"
                           value="AI &amp; Data Analytics Workshop"
                           maxlength="150"
                           required>


                    <!-- CATEGORY -->
                    <label for="category">
                        Category:
                    </label>

                    <select id="category"
                            name="category"
                            required>

                        <option value="Workshop" selected>
                            Workshop
                        </option>

                        <option value="Seminar">
                            Seminar
                        </option>

                        <option value="Competition">
                            Competition
                        </option>

                    </select>


                    <!-- DESCRIPTION -->
                    <label for="description">
                        Event Description:
                    </label>

                    <textarea id="description"
                              name="description"
                              rows="4"
                              required>Introduction to AI and Data Analytics</textarea>


                    <!-- DATE AND TIME -->
                    <label for="eventDate">
                        Event Date & Time:
                    </label>

                    <input type="datetime-local"
                           id="eventDate"
                           name="eventDate"
                           value="2026-11-21T09:00"
                           required>


                    <!-- VENUE -->
                    <label for="venue">
                        Venue:
                    </label>

                    <input type="text"
                           id="venue"
                           name="venue"
                           value="Computer Lab 2"
                           maxlength="150"
                           required>


                    <!-- CAPACITY -->
                    <label for="capacity">
                        Capacity (Students):
                    </label>

                    <input type="number"
                           id="capacity"
                           name="capacity"
                           value="40"
                           min="1"
                           step="1"
                           required>


                    <!-- SAVE BUTTON -->
                    <button type="submit">
                        Save Changes
                    </button>

                </form>


                <!-- RESULT MESSAGE -->
                <p id="updateMessage"
                   class="create-message"
                   role="status"
                   aria-live="polite"></p>

            </div>

        </section>

    </main>

    
<script>

function updateEvent(event) {

    // Stop normal form submission
    event.preventDefault();

    // Get updated values
    const eventName =
        document.getElementById("eventName").value.trim();

    const category =
        document.getElementById("category").value;

    const description =
        document.getElementById("description").value.trim();

    const eventDate =
        document.getElementById("eventDate").value;

    const venue =
        document.getElementById("venue").value.trim();

    const capacity =
        Number(document.getElementById("capacity").value);

    const message =
        document.getElementById("updateMessage");


    // Validate text fields
    if (eventName === "" ||
        description === "" ||
        venue === "") {

        message.textContent =
            "Please complete all event information.";

        message.style.color = "red";
        return;
    }


    // Validate event date
    const selectedTime = new Date(eventDate).getTime();

    if (!Number.isFinite(selectedTime) ||
        selectedTime <= Date.now()) {

        message.textContent =
            "Event date must be in the future.";

        message.style.color = "red";
        return;
    }


    // Validate capacity
    if (!Number.isInteger(capacity) || capacity < 1) {

        message.textContent =
            "Capacity must be a positive whole number.";

        message.style.color = "red";
        return;
    }


    // Create updated event object
    const updatedEvent = {
        name: eventName,
        category: category,
        description: description,
        date: eventDate,
        venue: venue,
        capacity: capacity
    };


    // Save temporary demo data in browser
    sessionStorage.setItem(
        "ehadir_updated_workshop",
        JSON.stringify(updatedEvent)
    );


    // Display success message
    message.textContent =
        "Event updated successfully (Demo only). " +
        "No changes were made to Apache Derby.";

    message.style.color = "green";

}

</script>


</body>
</html>
