    <div class="login-box">
        

<img src="images/logo-ehadir.png"
     alt="E-Hadir UiTM Logo"
     class="logo">

        

        <h1>Welcome to E-Hadir UiTM</h1>

        <p>
            Student Event & Workshop Ticketing System
        </p>

        <h2>Login Page</h2>

        <form onsubmit="event.preventDefault(); alert('Demo Login Page sahaja');">

            <label for="email">Email Address:</label>
            <input type="email"
                   id="email"
                   name="email"
                   placeholder="Enter your email"
                   required>

            <br><br>

            <label for="password">Password:</label>
            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Enter your password"
                   required>

            <br><br>

            <button type="submit">Login</button>

        </form>
        
        
<p>
